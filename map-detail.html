<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无畏契约 - 地图详情</title>
<style>
  :root {
    --bg-primary: #0f1923; --bg-secondary: #1a242d; --bg-card: #232f3a;
    --accent: #ff4655; --accent-dark: #bd3a4a; --text-primary: #ece8e1;
    --text-secondary: #8b978f; --text-muted: #5b6768; --border: #2a3a48;
    --duelist: #ff4655; --controller: #8b5cf6; --initiator: #22d3ee; --sentinel: #4ade80;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg-primary); color:var(--text-primary); line-height:1.6; }
  nav { position:fixed; top:0; width:100%; background:rgba(15,25,35,0.95); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); z-index:1000; padding:0 24px; }
  .nav-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:60px; }
  .nav-logo { font-size:1.2rem; font-weight:800; color:var(--accent); text-transform:uppercase; }
  .nav-back { color:var(--text-secondary); text-decoration:none; font-size:0.9rem; font-weight:500; transition:color 0.2s; }
  .nav-back:hover { color:var(--text-primary); }
  .map-hero { height:300px; overflow:hidden; position:relative; margin-top:60px; }
  .map-hero img { width:100%; height:100%; object-fit:cover; }
  .map-hero::after { content:""; position:absolute; inset:0; background:linear-gradient(to top,var(--bg-primary) 0%,transparent 60%); }
  .map-hero-text { position:absolute; bottom:40px; left:48px; z-index:2; }
  .map-hero-text h1 { font-size:2.4rem; font-weight:900; color:white; text-transform:uppercase; letter-spacing:2px; }
  .map-hero-text .map-cn { font-size:1.1rem; color:var(--accent); margin-top:4px; }
  main { max-width:1100px; margin:0 auto; padding:40px 24px 80px; }
  .section-card { background:var(--bg-secondary); border:1px solid var(--border); border-radius:12px; padding:28px; margin-bottom:24px; }
  .section-card h2 { font-size:1.4rem; font-weight:700; margin-bottom:16px; display:flex; align-items:center; gap:10px; }
  .section-card h2 .sec-icon { font-size:1.5rem; }
  .section-card h3 { font-size:1.05rem; font-weight:700; color:var(--accent); margin:16px 0 8px; }
  .section-card p, .section-card li { color:var(--text-secondary); font-size:0.92rem; }
  .section-card ul { padding-left:20px; }
  .section-card ul li { padding:3px 0; }
  .callout-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; margin-top:12px; }
  .callout-item { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:18px; }
  .callout-item h4 { font-size:0.95rem; font-weight:700; color:var(--accent); margin-bottom:6px; }
  .callout-item p { font-size:0.85rem; color:var(--text-secondary); }
  .agent-recs { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:12px; }
  .rec-box { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:18px; }
  .rec-box h4 { font-size:0.95rem; font-weight:700; margin-bottom:10px; }
  .rec-row { margin-bottom:10px; }
  .rec-row .rec-label { font-size:0.82rem; font-weight:600; color:var(--accent); }
  .rec-row .rec-value { font-size:0.85rem; color:var(--text-secondary); }
  .tips-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
  .tip-item { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:14px; }
  .tip-item h4 { font-size:0.9rem; font-weight:700; color:var(--accent); margin-bottom:4px; }
  .tip-item p { font-size:0.83rem; color:var(--text-secondary); }
  .features-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .features-row span { background:rgba(255,70,85,0.12); color:var(--accent); padding:4px 12px; border-radius:14px; font-size:0.8rem; font-weight:600; border:1px solid rgba(255,70,85,0.2); }
  .map-nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
  .map-nav a { padding:8px 16px; border-radius:8px; border:1px solid var(--border); color:var(--text-secondary); text-decoration:none; font-size:0.85rem; font-weight:500; transition:all 0.2s; background:var(--bg-secondary); }
  .map-nav a:hover { border-color:var(--accent); color:var(--text-primary); }
  .map-nav a.current { background:var(--accent); color:white; border-color:var(--accent); }
  @media (max-width:768px) {
    .agent-recs { grid-template-columns:1fr; }
    .map-hero { height:200px; }
    .map-hero-text h1 { font-size:1.6rem; }
    .map-hero-text { left:24px; bottom:20px; }
    main { padding:24px 14px 60px; }
  }
</style>
</head>

function getMap(id) {
  return MAPS.find(m => m.id === id) || MAPS[0];
}

function render() {
  const hash = window.location.hash.replace('#', '') || 'ascent';
  const map = getMap(hash);

  document.title = map.cn + ' ' + map.name + ' - 无畏契约地图攻略';

  // Nav buttons
  document.getElementById('mapNav').innerHTML = MAPS.map(m =>
    `<a href="#${m.id}" class="${m.id === hash ? 'current' : ''}">${m.cn}</a>`
  ).join('');

  // Hero
  document.getElementById('mapHero').innerHTML = `
    <div class="map-hero">
      <img src="${map.img}" alt="${map.cn}" onerror="this.style.display='none'">
      <div class="map-hero-text"><h1>${map.name}</h1><div class="map-cn">${map.cn}</div></div>
    </div>`;

  // Agent recs HTML
  const attackRecs = Object.entries(map.attack_agents).map(([role, agents]) =>
    `<div class="rec-row"><span class="rec-label">${role}：</span><span class="rec-value">${agents}</span></div>`
  ).join('');
  const defenseRecs = Object.entries(map.defense_agents).map(([role, agents]) =>
    `<div class="rec-row"><span class="rec-label">${role}：</span><span class="rec-value">${agents}</span></div>`
  ).join('');

  // Callouts HTML
  const callouts = Object.entries(map.callouts).map(([name, desc]) =>
    `<div class="callout-item"><h4>${name}</h4><p>${desc}</p></div>`
  ).join('');

  // Tips HTML
  const attackTips = map.attack_tips.map((t, i) =>
    `<div class="tip-item"><h4>进攻要点 ${i+1}</h4><p>${t}</p></div>`
  ).join('');
  const defenseTips = map.defense_tips.map((t, i) =>
    `<div class="tip-item"><h4>防守要点 ${i+1}</h4><p>${t}</p></div>`
  ).join('');

  document.getElementById('mapContent').innerHTML = `
    <div class="section-card">
      <h2><span class="sec-icon">📖</span>地图概述</h2>
      <p>${map.desc}</p>
    </div>
    <div class="section-card">
      <h2><span class="sec-icon">🗺️</span>地图布局</h2>
      <p>${map.layout}</p>
    </div>
    <div class="section-card">
      <h2><span class="sec-icon">📍</span>关键位置</h2>
      <div class="callout-grid">${callouts}</div>
    </div>
    <div class="section-card">
      <h2><span class="sec-icon">🦸</span>推荐特工</h2>
      <div class="agent-recs">
        <div class="rec-box">
          <h4>⚔️ 进攻方推荐</h4>
          ${attackRecs}
        </div>
        <div class="rec-box">
          <h4>🛡️ 防守方推荐</h4>
          ${defenseRecs}
        </div>
      </div>
    </div>
    <div class="section-card">
      <h2><span class="sec-icon">⚔️</span>进攻战术</h2>
      <div class="tips-grid">${attackTips}</div>
    </div>
    <div class="section-card">
      <h2><span class="sec-icon">🛡️</span>防守战术</h2>
      <div class="tips-grid">${defenseTips}</div>
    </div>
    <div class="section-card">
      <h2><span class="sec-icon">🏷️</span>地图特征</h2>
      <div class="features-row">${map.features.map(f => `<span>${f}</span>`).join('')}</div>
    </div>`;
}

window.addEventListener('hashchange', () => { window.scrollTo(0,0); render(); });
render();
</script>
